spring.application.name=sto-backend
server.port=${PORT:8080}

# Comma-separated list; override with APP_CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=http://localhost:4200,https://kacperkk2.github.io

# SSE: emitter timeout (client reconnects itself) and heartbeat interval
app.sse.timeout=30m
app.sse.heartbeat=25s

# Rooms with no REST activity for this long are closed (frees one of the 5 room numbers);
# checked every cleanup-interval
app.room.ttl=1h
app.room.cleanup-interval=5m

# Time the va banque chooser has to pick a target
app.game.va-banque-pick=10s

# Blind copy: time the drawn player has after the betting to keep their bet or take over another one
app.game.copy-pick=15s

# Dev only: POST /rooms/{code}/bots adds fake players that always bet 50/50
app.dev.bots-enabled=false
